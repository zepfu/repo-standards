[project]
name = "repo-standards"
version = "1.0.0"
description = "Organization-wide code quality standards and configuration templates"

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  \.eggs
  | \.git
  | \.venv
  | build
  | dist
  | templates
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true
extend_skip_glob = ["templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --tb=short"

[tool.bandit]
exclude_dirs = ["tests", ".venv", "venv", "build", "dist"]
# B101: assert used - acceptable in tests and scripts
# B404: import subprocess - needed for automation scripts
# B603: subprocess without shell - needed for automation scripts
skips = ["B101", "B404", "B603"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = [
    "build",
    "dist",
    ".venv",
    "venv",
    "tests",
]
