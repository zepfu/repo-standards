---
name: Shell Script Standards Enforcement

on:
  workflow_call:
    inputs:
      severity:
        type: string
        default: 'error'
        description: 'ShellCheck severity level (error, warning, info, style)'
      shellcheck-version:
        type: string
        default: 'v0.10.0'
        description: 'ShellCheck version to use'

  push:
    branches: [main, master]
    paths:
      - '**.sh'
      - '**.bash'
      - '.shellcheckrc'
      - 'scripts/**'

  pull_request:
    paths:
      - '**.sh'
      - '**.bash'
      - '.shellcheckrc'
      - 'scripts/**'

  workflow_dispatch: {}

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for shell scripts
        id: check_scripts
        run: |
          shopt -s globstar nullglob
          SCRIPTS=( **/*.sh )

          if [ ${#SCRIPTS[@]} -gt 0 ]; then
            echo "has_scripts=true" >> $GITHUB_OUTPUT
            echo "Found ${#SCRIPTS[@]} shell script(s)"
          else
            echo "has_scripts=false" >> $GITHUB_OUTPUT
          fi

      - name: Run ShellCheck
        if: steps.check_scripts.outputs.has_scripts == 'true'
        run: |
          SEVERITY="${{ inputs.severity }}"
          [ -z "$SEVERITY" ] && SEVERITY="error"

          pip install shellcheck-py

          echo "## Shell Script Standards" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Severity level: \`$SEVERITY\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          FAILED=false

          shopt -s globstar nullglob
          for file in **/*.sh; do
            if [ -f "$file" ]; then
              echo "Checking: $file"
              if shellcheck -S "$SEVERITY" -x "$file" 2>&1; then
                echo "- [PASS] \`$file\`" >> $GITHUB_STEP_SUMMARY
              else
                echo "- [FAIL] \`$file\`" >> $GITHUB_STEP_SUMMARY
                FAILED=true
              fi
            fi
          done

          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$FAILED" = "true" ]; then
            echo "**[FAIL] ShellCheck found issues**" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "**[PASS] All shell scripts passed ShellCheck**" >> $GITHUB_STEP_SUMMARY
          fi

      - name: No scripts found
        if: steps.check_scripts.outputs.has_scripts == 'false'
        run: |
          echo "## Shell Script Standards" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- [SKIP] No shell scripts found -- skipping ShellCheck" >> $GITHUB_STEP_SUMMARY

  bash-syntax:
    name: Bash Syntax Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for shell scripts
        id: check_scripts
        run: |
          shopt -s globstar nullglob
          SCRIPTS=( **/*.sh )

          if [ ${#SCRIPTS[@]} -gt 0 ]; then
            echo "has_scripts=true" >> $GITHUB_OUTPUT
          else
            echo "has_scripts=false" >> $GITHUB_OUTPUT
          fi

      - name: Validate Bash syntax
        if: steps.check_scripts.outputs.has_scripts == 'true'
        run: |
          FAILED=false

          shopt -s globstar nullglob
          for file in **/*.sh; do
            if [ -f "$file" ]; then
              echo "Checking: $file"
              if ! bash -n "$file" 2>&1; then
                FAILED=true
              fi
            fi
          done

          if [ "$FAILED" = "true" ]; then
            echo "- [FAIL] Bash syntax: errors found" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "- [PASS] Bash syntax: all scripts valid" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "**Shell script checks complete**" >> $GITHUB_STEP_SUMMARY

      - name: No scripts found
        if: steps.check_scripts.outputs.has_scripts == 'false'
        run: |
          echo "- [SKIP] No shell scripts found -- skipping syntax validation" >> $GITHUB_STEP_SUMMARY
