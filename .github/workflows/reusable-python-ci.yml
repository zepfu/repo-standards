---
name: Python Standards Enforcement

on:
  workflow_call:
    inputs:
      python-version:
        type: string
        default: '3.13'
        description: 'Python version (must be 3.11+)'
  push:
    branches: [main, master]
    paths:
      - '**.py'
      - 'pyproject.toml'
      - '.flake8'
  pull_request:
    paths:
      - '**.py'
      - 'pyproject.toml'
      - '.flake8'

jobs:
  validate-python-version:
    name: Validate Python Version
    runs-on: ubuntu-latest
    steps:
      - name: Check Python version requirement
        run: |
          REQUIRED="3.11"
          PROVIDED="${{ inputs.python-version }}"
          [ -z "$PROVIDED" ] && PROVIDED="3.13"

          if [[ "$PROVIDED" < "$REQUIRED" ]]; then
            echo "## Python Standards" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**[FAIL] Python version must be $REQUIRED+ (organization standard)**" >> $GITHUB_STEP_SUMMARY
            echo "- Provided: \`$PROVIDED\`" >> $GITHUB_STEP_SUMMARY
            echo "- See: https://github.com/zepfu/repo-standards#python-standards" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

  python-lint:
    name: Python Linting
    runs-on: ubuntu-latest
    needs: validate-python-version

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for Python files
        id: check_files
        run: |
          if compgen -G "**/*.py" > /dev/null 2>&1; then
            echo "has_python=true" >> $GITHUB_OUTPUT
          else
            echo "has_python=false" >> $GITHUB_OUTPUT
            echo "## Python Standards" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- [SKIP] No Python files found -- skipping linting" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Set up Python
        if: steps.check_files.outputs.has_python == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version || '3.13' }}

      - name: Install linting tools
        if: steps.check_files.outputs.has_python == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install black isort flake8

      - name: Run Black (check only)
        if: steps.check_files.outputs.has_python == 'true'
        run: |
          echo "## Python Standards" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if black --check --line-length=100 . 2>&1; then
            echo "- [PASS] Black: formatting check passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "- [FAIL] Black: formatting issues found" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Run \`black --line-length=100 .\` to fix" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Run isort (check only)
        if: steps.check_files.outputs.has_python == 'true'
        run: |
          if isort --check --profile=black --line-length=100 . 2>&1; then
            echo "- [PASS] isort: import ordering check passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "- [FAIL] isort: import ordering issues found" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Run \`isort --profile=black --line-length=100 .\` to fix" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Run Flake8
        if: steps.check_files.outputs.has_python == 'true'
        run: |
          if flake8 . --max-line-length=120 --extend-ignore=E203,W503 --max-complexity=20 2>&1; then
            echo "- [PASS] Flake8: linting check passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "- [FAIL] Flake8: linting issues found" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "**Python linting complete**" >> $GITHUB_STEP_SUMMARY

  python-syntax:
    name: Python Syntax Validation
    runs-on: ubuntu-latest
    needs: validate-python-version

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for Python files
        id: check_files
        run: |
          if compgen -G "**/*.py" > /dev/null 2>&1; then
            echo "has_python=true" >> $GITHUB_OUTPUT
          else
            echo "has_python=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Python
        if: steps.check_files.outputs.has_python == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version || '3.13' }}

      - name: Validate Python files compile
        if: steps.check_files.outputs.has_python == 'true'
        run: |
          FAILED=false

          shopt -s globstar nullglob
          for file in **/*.py; do
            if [ -f "$file" ]; then
              echo "Checking $file"
              if ! python -m py_compile "$file" 2>&1; then
                FAILED=true
              fi
            fi
          done

          if [ "$FAILED" = "true" ]; then
            echo "- [FAIL] Python syntax: compilation errors found" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "- [PASS] Python syntax: all files compile" >> $GITHUB_STEP_SUMMARY
          fi
