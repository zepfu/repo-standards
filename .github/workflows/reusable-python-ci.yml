---
name: Python Standards Enforcement

on:
  workflow_call:
    inputs:
      python-version:
        type: string
        default: '3.11'
        description: 'Python version (must be 3.11+)'

jobs:
  validate-python-version:
    name: Validate Python Version
    runs-on: ubuntu-latest
    steps:
      - name: Check Python version requirement
        run: |
          REQUIRED="3.11"
          PROVIDED="${{ inputs.python-version }}"
          if [[ "$PROVIDED" < "$REQUIRED" ]]; then
            echo "ERROR: Python version must be $REQUIRED+ (organization standard)"
            echo "Provided: $PROVIDED"
            echo "See: https://github.com/zepfu/repo-standards#python-standards"
            exit 1
          fi

  python-lint:
    name: Python Linting
    runs-on: ubuntu-latest
    needs: validate-python-version

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black isort flake8

      - name: Run Black (check only)
        run: |
          black --check --line-length=100 scripts/*.py

      - name: Run isort (check only)
        run: |
          isort --check --profile=black --line-length=100 scripts/*.py

      - name: Run Flake8
        run: |
          flake8 scripts/*.py \
            --max-line-length=120 \
            --extend-ignore=E203,W503 \
            --max-complexity=20

  python-syntax:
    name: Python Syntax Validation
    runs-on: ubuntu-latest
    needs: validate-python-version

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Validate Python files compile
        run: |
          shopt -s nullglob
          for file in scripts/*.py; do
            if [ -f "$file" ]; then
              echo "Checking $file"
              python -m py_compile "$file"
            fi
          done
