---
name: Update Documentation (Reusable)

on:
  workflow_call:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-docs:
    name: Update Repository Documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate repository map
        run: |
          echo "Generating REPO_MAP.md..."
          REPO_MAP_URL="https://raw.githubusercontent.com/zepfu/repo-standards/main/scripts/repo_map.py"
          curl -fsSL "$REPO_MAP_URL" | python3 - --output REPO_MAP.md

      - name: Generate changelog
        run: |
          echo "Generating CHANGELOG.md..."
          CHANGELOG_URL="https://raw.githubusercontent.com/zepfu/repo-standards/main/scripts/changelog.py"
          curl -fsSL "$CHANGELOG_URL" | python3 - --from-git --with-commits --output CHANGELOG.md

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet REPO_MAP.md CHANGELOG.md; then
            echo "No documentation changes"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "Documentation has changes"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request
        if: steps.check_changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'docs: update repository map and changelog [automated]'
          title: '📚 Update Documentation'
          body: |
            ## Automated Documentation Update

            This PR updates the repository documentation:

            - ✅ `REPO_MAP.md` - Repository structure
            - ✅ `CHANGELOG.md` - Git history

            ### Generated by
            - Workflow: `update-docs.yml`
            - Trigger: ${{ github.event_name }}
            - Run: ${{ github.run_id }}

            ### Review Checklist
            - [ ] Verify REPO_MAP.md structure is correct
            - [ ] Check CHANGELOG.md entries are accurate
            - [ ] Ensure no sensitive information exposed

            ---
            *This PR was automatically generated. Review and merge if changes look correct.*
          branch: docs/auto-update
          delete-branch: true
          labels: |
            documentation
            automated
          assignees: ${{ github.actor }}

      - name: Enable auto-merge
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          sleep 5
          gh pr merge --auto --squash docs/auto-update || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
