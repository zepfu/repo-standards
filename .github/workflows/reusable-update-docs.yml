---
name: Update Documentation (Reusable)

on:
  workflow_call:
    inputs:
      python-version:
        description: 'Python version to use'
        required: false
        type: string
        default: '3.13'
      docs-directory:
        description: 'Documentation directory path'
        required: false
        type: string
        default: 'docs'
      auto-docs-directory:
        description: 'Auto-generated docs directory path'
        required: false
        type: string
        default: 'docs/auto'
      generate-architecture:
        description: 'Generate architecture diagrams'
        required: false
        type: boolean
        default: true
      architecture-diagrams:
        description: 'Comma-separated list of diagram types or "all"'
        required: false
        type: string
        default: 'all'

  push:
    branches: [main, master]
    paths:
      - '**.py'
      - '**.sh'

  pull_request:
    paths:
      - '**.py'
      - '**.sh'

  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-and-build-docs:
    name: Update and Build Documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set defaults for inputs
        id: defaults
        run: |
          PYTHON_VERSION="${{ inputs.python-version }}"
          DOCS_DIR="${{ inputs.docs-directory }}"
          AUTO_DOCS_DIR="${{ inputs.auto-docs-directory }}"
          GEN_ARCH="${{ inputs.generate-architecture }}"
          ARCH_DIAGRAMS="${{ inputs.architecture-diagrams }}"

          [ -z "$PYTHON_VERSION" ] && PYTHON_VERSION="3.13"
          [ -z "$DOCS_DIR" ] && DOCS_DIR="docs"
          [ -z "$AUTO_DOCS_DIR" ] && AUTO_DOCS_DIR="docs/auto"
          [ -z "$GEN_ARCH" ] && GEN_ARCH="true"
          [ -z "$ARCH_DIAGRAMS" ] && ARCH_DIAGRAMS="all"

          echo "python_version=$PYTHON_VERSION" >> $GITHUB_OUTPUT
          echo "docs_dir=$DOCS_DIR" >> $GITHUB_OUTPUT
          echo "auto_docs_dir=$AUTO_DOCS_DIR" >> $GITHUB_OUTPUT
          echo "generate_arch=$GEN_ARCH" >> $GITHUB_OUTPUT
          echo "arch_diagrams=$ARCH_DIAGRAMS" >> $GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.defaults.outputs.python_version }}

      - name: Install Sphinx dependencies
        run: |
          DOCS_DIR="${{ steps.defaults.outputs.docs_dir }}"

          if [ -f "$DOCS_DIR/requirements.txt" ]; then
            pip install -r "$DOCS_DIR/requirements.txt"
          else
            echo "No requirements.txt found at $DOCS_DIR/requirements.txt"
            echo "Installing minimal Sphinx dependencies"
            pip install sphinx sphinx-rtd-theme myst-parser
          fi

      - name: Install PyYAML for architecture generation
        if: steps.defaults.outputs.generate_arch == 'true'
        run: |
          pip install pyyaml

      - name: Create auto-docs directory
        run: |
          mkdir -p "${{ steps.defaults.outputs.auto_docs_dir }}"

      - name: Generate CHANGELOG.md
        run: |
          AUTO_DOCS_DIR="${{ steps.defaults.outputs.auto_docs_dir }}"
          CHANGELOG_URL="https://raw.githubusercontent.com/zepfu/repo-standards/main/scripts/changelog.py"
          curl -fsSL "$CHANGELOG_URL" -o /tmp/changelog.py
          chmod +x /tmp/changelog.py

          python3 /tmp/changelog.py \
            --output "$AUTO_DOCS_DIR/CHANGELOG.md" \
            --from-git \
            --with-commits

      - name: Generate REPO_MAP.md
        run: |
          AUTO_DOCS_DIR="${{ steps.defaults.outputs.auto_docs_dir }}"
          REPO_MAP_URL="https://raw.githubusercontent.com/zepfu/repo-standards/main/scripts/repo_map.py"
          curl -fsSL "$REPO_MAP_URL" -o /tmp/repo_map.py
          chmod +x /tmp/repo_map.py

          python3 /tmp/repo_map.py \
            --output "$AUTO_DOCS_DIR/REPO_MAP.md"

      - name: Generate ARCHITECTURE_AUTO.md
        if: steps.defaults.outputs.generate_arch == 'true'
        run: |
          AUTO_DOCS_DIR="${{ steps.defaults.outputs.auto_docs_dir }}"
          ARCH_DIAGRAMS="${{ steps.defaults.outputs.arch_diagrams }}"

          ARCH_URL="https://raw.githubusercontent.com/zepfu/repo-standards/main/scripts/generate_architecture.py"
          curl -fsSL "$ARCH_URL" -o /tmp/generate_architecture.py
          chmod +x /tmp/generate_architecture.py

          if [ "$ARCH_DIAGRAMS" = "all" ]; then
            python3 /tmp/generate_architecture.py \
              --output "$AUTO_DOCS_DIR/ARCHITECTURE_AUTO.md" \
              --all-diagrams
          else
            python3 /tmp/generate_architecture.py \
              --output "$AUTO_DOCS_DIR/ARCHITECTURE_AUTO.md" \
              --diagrams "$ARCH_DIAGRAMS"
          fi

      - name: Generate WORKFLOW_REGISTRY.md
        run: |
          AUTO_DOCS_DIR="${{ steps.defaults.outputs.auto_docs_dir }}"
          REGISTRY_URL="https://raw.githubusercontent.com/zepfu/repo-standards/main/scripts/generate_workflow_registry.py"
          curl -fsSL "$REGISTRY_URL" -o /tmp/generate_workflow_registry.py
          chmod +x /tmp/generate_workflow_registry.py

          python3 /tmp/generate_workflow_registry.py \
            --output "$AUTO_DOCS_DIR/WORKFLOW_REGISTRY.md"

      - name: Format all markdown files
        run: |
          pip install mdformat mdformat-gfm mdformat-tables mdformat-frontmatter

          echo "Formatting all markdown files..."
          find . -name "*.md" -not -path "./.git/*" -not -path "./*_build/*" | while read -r file; do
            echo "Formatting: $file"
            mdformat --wrap 120 "$file"
          done

      - name: Run pre-commit on auto-generated files
        run: |
          pip install pre-commit
          pre-commit run --files ${{ steps.defaults.outputs.auto_docs_dir }}/* || true

      - name: Ensure auto-docs directory is tracked
        run: |
          touch "${{ steps.defaults.outputs.auto_docs_dir }}/.gitkeep"

      - name: Check for documentation changes
        id: check_changes
        run: |
          AUTO_DOCS_DIR="${{ steps.defaults.outputs.auto_docs_dir }}"

          # Stage auto-generated docs and any markdown formatting changes
          git add "$AUTO_DOCS_DIR/"
          git add "*.md" "**/*.md" 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "has_auto_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_auto_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit auto-documentation changes
        if: steps.check_changes.outputs.has_auto_changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git commit -m "docs: auto-update documentation [skip ci]"

          # Retry push with rebase in case remote advanced since checkout
          MAX_RETRIES=3
          for i in $(seq 1 "$MAX_RETRIES"); do
            if git push; then
              echo "Push succeeded"
              break
            fi
            echo "Push failed (attempt $i/$MAX_RETRIES), rebasing..."
            git pull --rebase
          done

      - name: Build Sphinx documentation
        run: |
          DOCS_DIR="${{ steps.defaults.outputs.docs_dir }}"
          cd "$DOCS_DIR"
          sphinx-build -b html . _build/html -W --keep-going

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./${{ steps.defaults.outputs.docs_dir }}/_build/html
          publish_branch: gh-pages
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'docs: deploy documentation [skip ci]'

      - name: Summary
        if: always()
        run: |
          GEN_ARCH="${{ steps.defaults.outputs.generate_arch }}"

          echo "## Documentation Build" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.check_changes.outputs.has_auto_changes }}" = "true" ]; then
            echo "- [PASS] Auto-documentation updated and committed" >> $GITHUB_STEP_SUMMARY
          else
            echo "- [SKIP] No auto-documentation changes" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Generated Files" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- CHANGELOG.md -- git history" >> $GITHUB_STEP_SUMMARY
          echo "- REPO_MAP.md -- repository structure" >> $GITHUB_STEP_SUMMARY
          echo "- WORKFLOW_REGISTRY.md -- workflow registry and tool coverage" >> $GITHUB_STEP_SUMMARY

          if [ "$GEN_ARCH" = "true" ]; then
            echo "- ARCHITECTURE_AUTO.md -- architecture diagrams" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            REPO="${GITHUB_REPOSITORY}"
            OWNER="${REPO%/*}"
            REPO_NAME="${REPO#*/}"

            echo "- [PASS] Sphinx docs built and deployed to GitHub Pages" >> $GITHUB_STEP_SUMMARY
            echo "- View at: https://${OWNER}.github.io/${REPO_NAME}/" >> $GITHUB_STEP_SUMMARY
          else
            echo "- [PASS] Sphinx docs built successfully (not deployed -- not on main)" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "**Documentation build complete**" >> $GITHUB_STEP_SUMMARY
