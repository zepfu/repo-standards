---
name: Update Documentation (Reusable)

on:
  workflow_call:
    inputs:
      python-version:
        description: 'Python version to use'
        required: false
        type: string
        default: '3.11'
      docs-directory:
        description: 'Documentation directory path'
        required: false
        type: string
        default: 'docs'
      auto-docs-directory:
        description: 'Auto-generated docs directory path'
        required: false
        type: string
        default: 'docs/auto'
      generate-architecture:
        description: 'Generate architecture diagrams'
        required: false
        type: boolean
        default: true
      architecture-diagrams:
        description: 'Comma-separated list of diagram types or "all"'
        required: false
        type: string
        default: 'all'

  push:
    branches: [main, master]
    paths:
      - '**.py'
      - '**.sh'

  pull_request:
    paths:
      - '**.py'
      - '**.sh'


  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-and-build-docs:
    name: Update and Build Documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for git history in changelog
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set defaults for inputs
        id: set_defaults
        run: |
          # Set defaults when inputs are empty (push/PR triggers)
          PYTHON_VERSION="${{ inputs.python-version }}"
          DOCS_DIR="${{ inputs.docs-directory }}"
          AUTO_DOCS_DIR="${{ inputs.auto-docs-directory }}"
          GEN_ARCH="${{ inputs.generate-architecture }}"
          ARCH_DIAGRAMS="${{ inputs.architecture-diagrams }}"

          [ -z "$PYTHON_VERSION" ] && PYTHON_VERSION="3.11"
          [ -z "$DOCS_DIR" ] && DOCS_DIR="docs"
          [ -z "$AUTO_DOCS_DIR" ] && AUTO_DOCS_DIR="docs/auto"
          [ -z "$GEN_ARCH" ] && GEN_ARCH="true"
          [ -z "$ARCH_DIAGRAMS" ] && ARCH_DIAGRAMS="all"

          echo "python_version=$PYTHON_VERSION" >> $GITHUB_OUTPUT
          echo "docs_dir=$DOCS_DIR" >> $GITHUB_OUTPUT
          echo "auto_docs_dir=$AUTO_DOCS_DIR" >> $GITHUB_OUTPUT
          echo "generate_arch=$GEN_ARCH" >> $GITHUB_OUTPUT
          echo "arch_diagrams=$ARCH_DIAGRAMS" >> $GITHUB_OUTPUT

          echo "Using configuration:"
          echo "  Python version: $PYTHON_VERSION"
          echo "  Docs directory: $DOCS_DIR"
          echo "  Auto-docs directory: $AUTO_DOCS_DIR"
          echo "  Generate architecture: $GEN_ARCH"
          echo "  Architecture diagrams: $ARCH_DIAGRAMS"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.set_defaults.outputs.python_version }}

      - name: Install Sphinx dependencies
        run: |
          DOCS_DIR="${{ steps.set_defaults.outputs.docs_dir }}"

          if [ -f "$DOCS_DIR/requirements.txt" ]; then
            echo "Installing Sphinx dependencies from $DOCS_DIR/requirements.txt"
            python3 -m pip install -r "$DOCS_DIR/requirements.txt"
          else
            echo "WARNING: No requirements.txt found at $DOCS_DIR/requirements.txt"
            echo "Installing minimal Sphinx dependencies"
            python3 -m pip install sphinx sphinx-rtd-theme myst-parser
          fi

      - name: Install PyYAML for architecture generation
        if: steps.set_defaults.outputs.generate_arch == 'true'
        run: |
          python3 -m pip install pyyaml

      - name: Create auto-docs directory
        run: |
          AUTO_DOCS_DIR="${{ steps.set_defaults.outputs.auto_docs_dir }}"
          echo "Creating directory: $AUTO_DOCS_DIR"
          mkdir -p "$AUTO_DOCS_DIR"

      - name: Generate CHANGELOG.md
        run: |
          echo "Generating CHANGELOG.md..."
          AUTO_DOCS_DIR="${{ steps.set_defaults.outputs.auto_docs_dir }}"
          CHANGELOG_URL="https://raw.githubusercontent.com/zepfu/repo-standards/main/scripts/changelog.py"
          curl -fsSL "$CHANGELOG_URL" | python3 - \
            --output "$AUTO_DOCS_DIR/CHANGELOG.md" \
            --from-git \
            --with-commits

      - name: Generate REPO_MAP.md
        run: |
          echo "Generating REPO_MAP.md..."
          AUTO_DOCS_DIR="${{ steps.set_defaults.outputs.auto_docs_dir }}"
          REPO_MAP_URL="https://raw.githubusercontent.com/zepfu/repo-standards/main/scripts/repo_map.py"
          curl -fsSL "$REPO_MAP_URL" | python3 - \
            --output "$AUTO_DOCS_DIR/REPO_MAP.md"

      - name: Generate ARCHITECTURE_AUTO.md
        if: steps.set_defaults.outputs.generate_arch == 'true'
        run: |
          echo "Generating ARCHITECTURE_AUTO.md..."
          AUTO_DOCS_DIR="${{ steps.set_defaults.outputs.auto_docs_dir }}"
          ARCH_DIAGRAMS="${{ steps.set_defaults.outputs.arch_diagrams }}"

          ARCH_URL="https://raw.githubusercontent.com/zepfu/repo-standards/main/scripts/generate_architecture.py"
          curl -fsSL "$ARCH_URL" -o /tmp/generate_architecture.py
          chmod +x /tmp/generate_architecture.py

          if [ "$ARCH_DIAGRAMS" = "all" ]; then
            python3 /tmp/generate_architecture.py \
              --output "$AUTO_DOCS_DIR/ARCHITECTURE_AUTO.md" \
              --all-diagrams
          else
            python3 /tmp/generate_architecture.py \
              --output "$AUTO_DOCS_DIR/ARCHITECTURE_AUTO.md" \
              --diagrams "$ARCH_DIAGRAMS"
          fi


      - name: Ensure auto-docs directory is tracked
        run: |
          AUTO_DOCS_DIR="${{ steps.set_defaults.outputs.auto_docs_dir }}"

          # Ensure .gitkeep exists to track the directory
          touch "$AUTO_DOCS_DIR/.gitkeep"

          echo "Auto-generated docs status:"
          ls -lh "$AUTO_DOCS_DIR/"

      - name: Check for documentation changes
        id: check_changes
        run: |
          AUTO_DOCS_DIR="${{ steps.set_defaults.outputs.auto_docs_dir }}"
          git add "$AUTO_DOCS_DIR/"

          if git diff --cached --quiet; then
            echo "No auto-documentation changes"
            echo "has_auto_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "Auto-documentation has changes"
            echo "has_auto_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit auto-documentation changes
        if: steps.check_changes.outputs.has_auto_changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git commit -m "docs: auto-update documentation [skip ci]"
          git push

      - name: Build Sphinx documentation
        run: |
          DOCS_DIR="${{ steps.set_defaults.outputs.docs_dir }}"
          cd "$DOCS_DIR"

          # Build with warnings as errors, but keep going to see all issues
          sphinx-build -b html . _build/html -W --keep-going

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./${{ steps.set_defaults.outputs.docs_dir }}/_build/html
          publish_branch: gh-pages
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'docs: deploy documentation [skip ci]'

      - name: Summary
        run: |
          GEN_ARCH="${{ steps.set_defaults.outputs.generate_arch }}"

          echo "## Documentation Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.check_changes.outputs.has_auto_changes }}" = "true" ]; then
            echo "✅ Auto-documentation updated and committed" >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ No auto-documentation changes" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "✅ Sphinx documentation built and deployed to GitHub Pages" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            # Extract repo owner and name from GITHUB_REPOSITORY
            REPO="${GITHUB_REPOSITORY}"
            OWNER="${REPO%/*}"
            REPO_NAME="${REPO#*/}"

            echo "🔗 View documentation at: https://${OWNER}.github.io/${REPO_NAME}/" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ Sphinx documentation built successfully (not deployed - not on main branch)" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Generated Files" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ CHANGELOG.md - Git history" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ REPO_MAP.md - Repository structure" >> $GITHUB_STEP_SUMMARY

          if [ "$GEN_ARCH" = "true" ]; then
            echo "- ✅ ARCHITECTURE_AUTO.md - Architecture diagrams" >> $GITHUB_STEP_SUMMARY
          fi
