---
name: Update Documentation

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/**'
      - '!docs/_build/**'
      - '!docs/auto/**'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-docs:
    name: Generate Auto-Documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python3 -m pip install --user pyyaml

      - name: Create output directory
        run: |
          mkdir -p docs/auto

      - name: Generate changelog
        run: |
          python3 scripts/changelog.py --output docs/auto/CHANGELOG.md

      - name: Generate repo map
        run: |
          python3 scripts/repo_map.py --output docs/auto/REPO_MAP.md

      - name: Generate architecture
        run: |
          python3 scripts/generate_architecture.py \
            --output docs/auto/ARCHITECTURE_AUTO.md \
            --all-diagrams

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet docs/auto/; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes detected"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changes detected"
          fi

      - name: Create Pull Request
        if: steps.check.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'docs: auto-update documentation'
          title: 'Auto-update Documentation'
          body: |
            ## 🤖 Automated Documentation Update

            Auto-generated documentation has been updated:
            - ✅ CHANGELOG.md - Generated from git history
            - ✅ REPO_MAP.md - Repository structure
            - ✅ ARCHITECTURE_AUTO.md - Architecture diagrams

            ### What to Review
            - Check that diagrams accurately reflect current codebase
            - Verify changelog entries are categorized correctly
            - Ensure no sensitive information is exposed

            ### Merge When
            - All checks pass
            - Content looks accurate
            - Ready to deploy docs

            ---
            *Auto-generated by `.github/workflows/update-docs.yml`*
          branch: auto-update-docs
          delete-branch: true
          labels: documentation,automated

      - name: Summary
        run: |
          if [[ "${{ steps.check.outputs.changed }}" == "true" ]]; then
            echo "## Documentation Updated" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ Pull request created for review" >> $GITHUB_STEP_SUMMARY
          else
            echo "## No Changes" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Documentation is already up to date" >> $GITHUB_STEP_SUMMARY
          fi
