---
name: Config Standards Validation

on:
  workflow_call:
  push:
    branches: [main, master]
    paths:
      - '.gitattributes'
      - '.gitignore'
      - '.editorconfig'
      - '.flake8'
      - '.shellcheckrc'
      - '.pre-commit-config.yaml'
      - '.markdownlint.json'
      - 'pyproject.toml'
  pull_request:
    paths:
      - '.gitattributes'
      - '.gitignore'
      - '.editorconfig'
      - '.flake8'
      - '.shellcheckrc'
      - '.pre-commit-config.yaml'
      - '.markdownlint.json'
      - 'pyproject.toml'

jobs:
  validate-configs:
    name: Validate Required Config Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check required config files exist
        run: |
          echo "## Config Standards Validation" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          REQUIRED_FILES=(
            ".gitattributes"
            ".gitignore"
            ".editorconfig"
            ".flake8"
            ".shellcheckrc"
            ".pre-commit-config.yaml"
          )

          RECOMMENDED_FILES=(
            ".markdownlint.json"
            "pyproject.toml"
          )

          MISSING_REQUIRED=()
          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              MISSING_REQUIRED+=("$file")
            fi
          done

          if [ ${#MISSING_REQUIRED[@]} -ne 0 ]; then
            echo "**[FAIL] Missing required config files:**" >> "$GITHUB_STEP_SUMMARY"
            printf '  - \`%s\`\n' "${MISSING_REQUIRED[@]}" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Run: \`curl -fsSL https://raw.githubusercontent.com/zepfu/repo-standards/main/scripts/sync-configs.sh | bash\`" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "- [PASS] All required config files present" >> "$GITHUB_STEP_SUMMARY"

          # Check recommended files (warnings only)
          MISSING_RECOMMENDED=()
          for file in "${RECOMMENDED_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              MISSING_RECOMMENDED+=("$file")
            fi
          done

          if [ ${#MISSING_RECOMMENDED[@]} -ne 0 ]; then
            echo "- [WARN] Recommended files missing (non-blocking):" >> "$GITHUB_STEP_SUMMARY"
            printf '    - \`%s\`\n' "${MISSING_RECOMMENDED[@]}" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Validate .gitattributes content
        run: |
          FAILED=false

          if ! grep -q "text=auto" .gitattributes; then
            echo "- [FAIL] .gitattributes: missing \`* text=auto\`" >> "$GITHUB_STEP_SUMMARY"
            FAILED=true
          fi

          if ! grep -q "\.sh text eol=lf" .gitattributes; then
            echo "- [FAIL] .gitattributes: must enforce LF for .sh files" >> "$GITHUB_STEP_SUMMARY"
            FAILED=true
          fi

          if ! grep -q "\.py text eol=lf" .gitattributes; then
            echo "- [FAIL] .gitattributes: must enforce LF for .py files" >> "$GITHUB_STEP_SUMMARY"
            FAILED=true
          fi

          if [ "$FAILED" = "true" ]; then
            exit 1
          fi

          echo "- [PASS] .gitattributes content is valid" >> "$GITHUB_STEP_SUMMARY"

      - name: Validate .gitignore content
        run: |
          REQUIRED_PATTERNS=(
            "__pycache__"
            "*.pyc"
            ".venv"
            ".env"
          )

          MISSING=()
          for pattern in "${REQUIRED_PATTERNS[@]}"; do
            if ! grep -q "$pattern" .gitignore; then
              MISSING+=("$pattern")
            fi
          done

          if [ ${#MISSING[@]} -ne 0 ]; then
            echo "- [WARN] .gitignore: recommended patterns missing (non-blocking):" >> "$GITHUB_STEP_SUMMARY"
            printf '    - \`%s\`\n' "${MISSING[@]}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- [PASS] .gitignore has all required patterns" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "---" >> "$GITHUB_STEP_SUMMARY"
          echo "**Config validation complete**" >> "$GITHUB_STEP_SUMMARY"
