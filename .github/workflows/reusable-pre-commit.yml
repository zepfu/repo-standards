---
name: Pre-commit Standards Enforcement

on:
  workflow_call:
    inputs:
      python-version:
        type: string
        default: '3.13'
        description: 'Python version for pre-commit'
  push:
    branches: [main, master]
    paths:
      - '.pre-commit-config.yaml'
      - '**.py'
      - '**.sh'
      - '**.yml'
      - '**.yaml'
  pull_request:
    paths:
      - '.pre-commit-config.yaml'
      - '**.py'
      - '**.sh'
      - '**.yml'
      - '**.yaml'

  workflow_dispatch: {}

jobs:
  pre-commit:
    name: Pre-commit Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Verify pre-commit config exists
        run: |
          if [ ! -f .pre-commit-config.yaml ]; then
            echo "## Pre-commit Standards" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**[FAIL] .pre-commit-config.yaml not found**" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Run: \`curl -fsSL https://raw.githubusercontent.com/zepfu/repo-standards/main/scripts/sync-configs.sh | bash\`" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python-version || '3.13' }}

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

      - name: Summary
        if: always()
        run: |
          echo "## Pre-commit Standards" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ job.status }}" = "success" ]; then
            echo "- [PASS] All pre-commit hooks passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- [FAIL] Pre-commit hooks found issues (see log output above)" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "---" >> "$GITHUB_STEP_SUMMARY"
          echo "**Pre-commit checks complete**" >> "$GITHUB_STEP_SUMMARY"
