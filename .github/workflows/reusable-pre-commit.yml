---
name: Pre-commit Standards Enforcement (Docker)

on:
  workflow_call:
    inputs:
      python-version:
        type: string
        default: '3.13'
        description: 'Python version for pre-commit'
  push:
    branches: [main, master]
    paths:
      - '.pre-commit-config.yaml'
      - '**.py'
      - '**.sh'
      - '**.yml'
      - '**.yaml'
  pull_request:
    paths:
      - '.pre-commit-config.yaml'
      - '**.py'
      - '**.sh'
      - '**.yml'
      - '**.yaml'

jobs:
  pre-commit:
    name: Pre-commit Checks (Docker)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Verify pre-commit config exists
        run: |
          if [ ! -f .pre-commit-config.yaml ]; then
            echo "ERROR: .pre-commit-config.yaml is required (organization standard)"
            echo "Run: curl -fsSL https://raw.githubusercontent.com/zepfu/repo-standards/main/scripts/sync-configs.sh | bash"
            exit 1
          fi

      - name: Create cache directory
        run: mkdir -p /tmp/pre-commit-cache

      - name: Cache pre-commit hooks
        uses: actions/cache@v5
        with:
          path: /tmp/pre-commit-cache
          key: pre-commit-docker-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-docker-${{ runner.os }}-

      - name: Run pre-commit with Docker
        run: |
          docker run --rm \
            -v "$(pwd)":/src \
            -w /src \
            -v /tmp/pre-commit-cache:/cache \
            -e PRE_COMMIT_HOME=/cache \
            ghcr.io/pre-commit/pre-commit:latest \
            run --all-files --show-diff-on-failure
