---
name: Pre-commit Standards Enforcement

on:
  workflow_call:
    inputs:
      python-version:
        type: string
        default: '3.13'
        description: 'Python version for pre-commit'
  push:
    branches: [main, master]
    paths:
      - '.pre-commit-config.yaml'
      - '**.py'
      - '**.sh'
      - '**.yml'
      - '**.yaml'
  pull_request:
    paths:
      - '.pre-commit-config.yaml'
      - '**.py'
      - '**.sh'
      - '**.yml'
      - '**.yaml'

jobs:
  pre-commit:
    name: Pre-commit Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Verify pre-commit config exists
        run: |
          if [ ! -f .pre-commit-config.yaml ]; then
            echo "ERROR: .pre-commit-config.yaml is required (organization standard)"
            echo "Run: curl -fsSL https://raw.githubusercontent.com/zepfu/repo-standards/main/scripts/sync-configs.sh | bash"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python-version || '3.13' }}

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1
