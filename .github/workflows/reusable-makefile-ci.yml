---
name: Makefile Standards Enforcement

on:
  workflow_call:
    inputs:
      fail-on-warnings:
        type: boolean
        default: false
        description: 'Fail build on checkmake warnings'

  push:
    branches: [main, master]
    paths:
      - 'Makefile'
      - '*.mk'
      - '**/*.mk'

  pull_request:
    paths:
      - 'Makefile'
      - '*.mk'
      - '**/*.mk'

jobs:
  validate-makefile:
    name: Validate Makefile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check if Makefile exists
        id: check_makefile
        run: |
          if [ -f "Makefile" ]; then
            echo "has_makefile=true" >> $GITHUB_OUTPUT
            echo "✓ Makefile found"
          else
            echo "has_makefile=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No Makefile found, skipping validation"
          fi

      - name: Validate Makefile syntax
        if: steps.check_makefile.outputs.has_makefile == 'true'
        run: |
          echo "Checking Makefile syntax with 'make -n'..."

          # Get list of targets from help (or use 'all' as fallback)
          TARGETS=$(make -qp 2>/dev/null | awk -F':' '/^[a-zA-Z0-9][^$#\/\t=]*:([^=]|$)/ {split($1,A,/ /);for(i in A)print A[i]}' | sort -u | head -1)

          if [ -z "$TARGETS" ]; then
            TARGETS="help"
          fi

          echo "Testing target: $TARGETS"

          if make -n $TARGETS >/dev/null 2>&1; then
            echo "✓ Makefile syntax is valid"
          else
            echo "✗ Makefile has syntax errors:"
            make -n $TARGETS
            exit 1
          fi

      - name: Setup checkmake
        if: steps.check_makefile.outputs.has_makefile == 'true'
        run: |
          echo "Setting up checkmake (latest version via Docker)..."

          # Pull latest Docker image
          docker pull quay.io/checkmake/checkmake:latest

          # Create wrapper script
          cat > /tmp/checkmake << 'EOFMARKER'
          #!/bin/bash
          docker run --rm -v "$(pwd)":/data -w /data quay.io/checkmake/checkmake:latest "$@"
          EOFMARKER

          chmod +x /tmp/checkmake
          sudo mv /tmp/checkmake /usr/local/bin/checkmake

          echo "✓ checkmake installed (Docker-based)"
          checkmake --version

      - name: Lint Makefile with checkmake
        if: steps.check_makefile.outputs.has_makefile == 'true'
        run: |
          echo "Running checkmake on Makefile..."

          # Set default if input is empty
          FAIL_ON_WARNINGS="${{ inputs.fail-on-warnings }}"
          [ -z "$FAIL_ON_WARNINGS" ] && FAIL_ON_WARNINGS="false"

          FAILED=false

          if checkmake Makefile; then
            echo "✓ Makefile: No issues found"
          else
            EXIT_CODE=$?

            if [ "$FAIL_ON_WARNINGS" = "true" ]; then
              echo "✗ Makefile: checkmake found issues"
              FAILED=true
            else
              echo "⚠️ Makefile: checkmake found issues (non-blocking)"
            fi
          fi

          # Find and check all .mk files
          echo ""
          echo "Searching for .mk files..."

          MK_FILES=$(find . -name "*.mk" -type f -not -path "*/\.*" 2>/dev/null || true)

          if [ -n "$MK_FILES" ]; then
            MK_COUNT=$(echo "$MK_FILES" | wc -l)
            echo "Found $MK_COUNT .mk file(s)"
            echo ""

            while IFS= read -r mk_file; do
              echo "Running checkmake on $mk_file..."

              if checkmake "$mk_file"; then
                echo "✓ $mk_file: No issues found"
              else
                EXIT_CODE=$?

                if [ "$FAIL_ON_WARNINGS" = "true" ]; then
                  echo "✗ $mk_file: checkmake found issues"
                  FAILED=true
                else
                  echo "⚠️ $mk_file: checkmake found issues (non-blocking)"
                fi
              fi
              echo ""
            done <<< "$MK_FILES"
          else
            echo "ℹ️ No .mk files found"
          fi

          if [ "$FAILED" = "true" ]; then
            exit 1
          fi

      - name: Check for .PHONY declarations
        if: steps.check_makefile.outputs.has_makefile == 'true'
        run: |
          echo "Checking for .PHONY declarations..."

          if grep -q "^\.PHONY:" Makefile; then
            echo "✓ Makefile: .PHONY declarations found"

            # Show what's declared as phony
            echo ""
            echo "Phony targets in Makefile:"
            grep "^\.PHONY:" Makefile | sed 's/^\.PHONY: /  - /'
          else
            echo "⚠️ Makefile: No .PHONY declarations found"
            echo "Consider adding .PHONY declarations for non-file targets"
          fi

          # Check all .mk files
          MK_FILES=$(find . -name "*.mk" -type f -not -path "*/\.*" 2>/dev/null || true)

          if [ -n "$MK_FILES" ]; then
            while IFS= read -r mk_file; do
              echo ""
              if grep -q "^\.PHONY:" "$mk_file"; then
                echo "✓ $mk_file: .PHONY declarations found"
                echo ""
                echo "Phony targets in $mk_file:"
                grep "^\.PHONY:" "$mk_file" | sed 's/^\.PHONY: /  - /'
              else
                echo "⚠️ $mk_file: No .PHONY declarations found"
              fi
            done <<< "$MK_FILES"
          fi

      - name: Check for tabs (not spaces)
        if: steps.check_makefile.outputs.has_makefile == 'true'
        run: |
          echo "Checking that recipes use tabs (not spaces)..."

          FAILED=false

          # Check Makefile
          if grep -n '^        [a-zA-Z@-]' Makefile >/dev/null 2>&1; then
            echo "✗ Makefile: Found potential recipes using spaces instead of tabs:"
            grep -n '^        [a-zA-Z@-]' Makefile
            FAILED=true
          else
            echo "✓ Makefile: Recipe indentation looks correct"
          fi

          # Check all .mk files
          MK_FILES=$(find . -name "*.mk" -type f -not -path "*/\.*" 2>/dev/null || true)

          if [ -n "$MK_FILES" ]; then
            while IFS= read -r mk_file; do
              echo ""
              if grep -n '^        [a-zA-Z@-]' "$mk_file" >/dev/null 2>&1; then
                echo "✗ $mk_file: Found potential recipes using spaces instead of tabs:"
                grep -n '^        [a-zA-Z@-]' "$mk_file"
                FAILED=true
              else
                echo "✓ $mk_file: Recipe indentation looks correct"
              fi
            done <<< "$MK_FILES"
          fi

          if [ "$FAILED" = "true" ]; then
            echo ""
            echo "Makefiles require tabs for recipe indentation, not spaces!"
            exit 1
          fi

      - name: Summary
        if: steps.check_makefile.outputs.has_makefile == 'true'
        run: |
          echo "## Makefile Validation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Makefile syntax validation passed" >> $GITHUB_STEP_SUMMARY
          echo "✅ checkmake linting completed" >> $GITHUB_STEP_SUMMARY
          echo "✅ .PHONY declarations checked" >> $GITHUB_STEP_SUMMARY
          echo "✅ Tab indentation verified" >> $GITHUB_STEP_SUMMARY

      - name: No Makefile summary
        if: steps.check_makefile.outputs.has_makefile == 'false'
        run: |
          echo "## Makefile Validation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "ℹ️ No Makefile found - skipping validation" >> $GITHUB_STEP_SUMMARY
