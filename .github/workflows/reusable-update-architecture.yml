---
name: Update Architecture Documentation

on:
  workflow_call:
    inputs:
      output-path:
        description: 'Output file path for generated documentation'
        required: false
        type: string
        default: 'docs/ARCHITECTURE_AUTO.md'
      diagrams:
        description: 'Comma-separated list of diagram types to generate (or "all" for all diagrams)'
        required: false
        type: string
        default: 'all'
      python-version:
        description: 'Python version to use'
        required: false
        type: string
        default: '3.11'
      create-pr:
        description: 'Create PR if changes detected'
        required: false
        type: boolean
        default: true

  push:
    branches: [main, master]
    paths:
      - '**.py'
      - '**.sh'
      - '.github/workflows/**'
      - 'scripts/generate_architecture.py'

  pull_request:
    paths:
      - '**.py'
      - '**.sh'
      - '.github/workflows/**'
      - 'scripts/generate_architecture.py'

  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-architecture:
    name: Generate Architecture Documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install PyYAML
        run: |
          python3 -m pip install --user pyyaml

      - name: Download architecture generator
        run: |
          curl -fsSL https://raw.githubusercontent.com/zepfu/repo-standards/main/scripts/generate_architecture.py \
            -o /tmp/generate_architecture.py
          chmod +x /tmp/generate_architecture.py

      - name: Generate architecture documentation
        run: |
          # Set defaults if inputs are empty (happens when triggered by push/PR)
          OUTPUT_PATH="${{ inputs.output-path }}"
          DIAGRAMS="${{ inputs.diagrams }}"

          if [ -z "$OUTPUT_PATH" ]; then
            OUTPUT_PATH="docs/auto/ARCHITECTURE_AUTO.md"
          fi

          if [ -z "$DIAGRAMS" ]; then
            DIAGRAMS="all"
          fi

          echo "Output path: $OUTPUT_PATH"
          echo "Diagrams: $DIAGRAMS"

          # Create output directory if it doesn't exist
          mkdir -p "$(dirname "$OUTPUT_PATH")"

          if [ "$DIAGRAMS" = "all" ]; then
            python3 /tmp/generate_architecture.py \
              --output "$OUTPUT_PATH" \
              --all-diagrams
          else
            python3 /tmp/generate_architecture.py \
              --output "$OUTPUT_PATH" \
              --diagrams "$DIAGRAMS"
          fi

      - name: Check if documentation changed
        id: check_changes
        run: |
          OUTPUT_PATH="${{ inputs.output-path }}"

          if [ -z "$OUTPUT_PATH" ]; then
            OUTPUT_PATH="docs/auto/ARCHITECTURE_AUTO.md"
          fi

          if git diff --quiet "$OUTPUT_PATH"; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes detected in architecture documentation"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changes detected in architecture documentation"
          fi

      - name: Create Pull Request
        if: steps.check_changes.outputs.changed == 'true' && (inputs.create-pr == true || inputs.create-pr == '')
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'docs: auto-update architecture documentation'
          title: 'Auto-update Architecture Documentation'
          body: |
            ## 🤖 Automated Architecture Update

            This PR was automatically generated because changes were detected in the codebase.

            ### What Changed

            The architecture documentation has been regenerated from the current codebase using:
            - **Generator:** `generate_architecture.py` from [repo-standards](https://github.com/zepfu/repo-standards)
            - **Diagrams:** ${{ inputs.diagrams }}
            - **Output:** `${{ inputs.output-path }}`

            ### What to Review

            - ✅ Check that diagrams accurately reflect the current codebase
            - ✅ Verify relationships between components are correct
            - ✅ Ensure no sensitive information is exposed
            - ✅ Confirm state machines and workflows are accurate

            ### Known Limitations

            Auto-generated diagrams may miss:
            - Dynamic behavior (runtime, plugins)
            - External systems (databases, queues)
            - Configuration-driven behavior
            - Dead code (appears equal to active code)

            See [GOTCHAS_AND_LIMITATIONS.md](https://github.com/zepfu/repo-standards/blob/main/docs/GOTCHAS_AND_LIMITATIONS.md) for details.

            ### Next Steps

            1. Review the changes carefully
            2. Add manual enhancements to `docs/ARCHITECTURE.md` if needed
            3. Merge when satisfied

            ---

            *Generated by: `.github/workflows/reusable-update-architecture.yml` from repo-standards*
          branch: auto-update-architecture
          delete-branch: true
          labels: |
            documentation
            automated
            architecture

      - name: Summary
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          OUTPUT_PATH="${{ inputs.output-path }}"
          CREATE_PR="${{ inputs.create-pr }}"

          if [ -z "$OUTPUT_PATH" ]; then
            OUTPUT_PATH="docs/auto/ARCHITECTURE_AUTO.md"
          fi

          if [ -z "$CREATE_PR" ]; then
            CREATE_PR="true"
          fi

          echo "## Architecture Documentation Updated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Generated: \`$OUTPUT_PATH\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "$CREATE_PR" = "true" ]; then
            echo "📝 Pull request created for review" >> $GITHUB_STEP_SUMMARY
          else
            echo "📝 Changes committed directly (no PR)" >> $GITHUB_STEP_SUMMARY
          fi

      - name: No changes summary
        if: steps.check_changes.outputs.changed == 'false'
        run: |
          echo "## No Changes Detected" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Architecture documentation is already up to date." >> $GITHUB_STEP_SUMMARY
