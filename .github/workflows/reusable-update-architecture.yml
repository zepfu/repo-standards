---
name: Update Architecture Documentation

on:
  workflow_call:
    inputs:
      output-path:
        description: 'Output file path for generated documentation'
        required: false
        type: string
        default: 'docs/auto/ARCHITECTURE_AUTO.md'
      diagrams:
        description: 'Comma-separated list of diagram types to generate (or "all" for all diagrams)'
        required: false
        type: string
        default: 'all'
      python-version:
        description: 'Python version to use'
        required: false
        type: string
        default: '3.13'

  push:
    branches: [main, master]
    paths:
      - '**.py'
      - '**.sh'
      - '.github/workflows/**'
      - 'scripts/generate_architecture.py'

  pull_request:
    paths:
      - '**.py'
      - '**.sh'
      - '.github/workflows/**'
      - 'scripts/generate_architecture.py'

  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate-architecture:
    name: Generate Architecture Documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set defaults for inputs
        id: defaults
        run: |
          OUTPUT_PATH="${{ inputs.output-path }}"
          DIAGRAMS="${{ inputs.diagrams }}"
          PYTHON_VERSION="${{ inputs.python-version }}"

          [ -z "$OUTPUT_PATH" ] && OUTPUT_PATH="docs/auto/ARCHITECTURE_AUTO.md"
          [ -z "$DIAGRAMS" ] && DIAGRAMS="all"
          [ -z "$PYTHON_VERSION" ] && PYTHON_VERSION="3.13"

          echo "output_path=$OUTPUT_PATH" >> $GITHUB_OUTPUT
          echo "diagrams=$DIAGRAMS" >> $GITHUB_OUTPUT
          echo "python_version=$PYTHON_VERSION" >> $GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.defaults.outputs.python_version }}

      - name: Install PyYAML
        run: |
          pip install pyyaml

      - name: Download architecture generator
        run: |
          curl -fsSL https://raw.githubusercontent.com/zepfu/repo-standards/main/scripts/generate_architecture.py \
            -o /tmp/generate_architecture.py
          chmod +x /tmp/generate_architecture.py

      - name: Generate architecture documentation
        run: |
          OUTPUT_PATH="${{ steps.defaults.outputs.output_path }}"
          DIAGRAMS="${{ steps.defaults.outputs.diagrams }}"

          mkdir -p "$(dirname "$OUTPUT_PATH")"

          if [ "$DIAGRAMS" = "all" ]; then
            python3 /tmp/generate_architecture.py \
              --output "$OUTPUT_PATH" \
              --all-diagrams
          else
            python3 /tmp/generate_architecture.py \
              --output "$OUTPUT_PATH" \
              --diagrams "$DIAGRAMS"
          fi

      - name: Format generated markdown
        run: |
          OUTPUT_PATH="${{ steps.defaults.outputs.output_path }}"
          pip install mdformat mdformat-gfm mdformat-tables mdformat-frontmatter
          echo "Formatting: $OUTPUT_PATH"
          mdformat --wrap 120 "$OUTPUT_PATH"

      - name: Check if documentation changed
        id: check_changes
        run: |
          OUTPUT_PATH="${{ steps.defaults.outputs.output_path }}"

          if git diff --quiet "$OUTPUT_PATH" 2>/dev/null; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          OUTPUT_PATH="${{ steps.defaults.outputs.output_path }}"

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add "$OUTPUT_PATH"
          git commit -m "docs: auto-update architecture documentation [skip ci]"
          git push

      - name: Summary
        if: always()
        run: |
          echo "## Architecture Documentation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.check_changes.outputs.changed }}" = "true" ]; then
            echo "- [PASS] Generated: \`${{ steps.defaults.outputs.output_path }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- Changes committed directly to \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "- [SKIP] Architecture documentation is already up to date" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "**Architecture generation complete**" >> $GITHUB_STEP_SUMMARY
