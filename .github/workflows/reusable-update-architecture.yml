---
name: Update Architecture Documentation

on:
  workflow_call:
    inputs:
      output-path:
        description: 'Output file path for generated documentation'
        required: false
        type: string
        default: 'docs/auto/ARCHITECTURE_AUTO.md'
      diagrams:
        description: 'Comma-separated list of diagram types to generate (or "all" for all diagrams)'
        required: false
        type: string
        default: 'all'
      python-version:
        description: 'Python version to use'
        required: false
        type: string
        default: '3.13'
      create-pr:
        description: 'Create PR if changes detected'
        required: false
        type: boolean
        default: true

  push:
    branches: [main, master]
    paths:
      - '**.py'
      - '**.sh'
      - '.github/workflows/**'
      - 'scripts/generate_architecture.py'

  pull_request:
    paths:
      - '**.py'
      - '**.sh'
      - '.github/workflows/**'
      - 'scripts/generate_architecture.py'

  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-architecture:
    name: Generate Architecture Documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set defaults for inputs
        id: defaults
        run: |
          OUTPUT_PATH="${{ inputs.output-path }}"
          DIAGRAMS="${{ inputs.diagrams }}"
          PYTHON_VERSION="${{ inputs.python-version }}"
          CREATE_PR="${{ inputs.create-pr }}"

          [ -z "$OUTPUT_PATH" ] && OUTPUT_PATH="docs/auto/ARCHITECTURE_AUTO.md"
          [ -z "$DIAGRAMS" ] && DIAGRAMS="all"
          [ -z "$PYTHON_VERSION" ] && PYTHON_VERSION="3.13"
          [ -z "$CREATE_PR" ] && CREATE_PR="true"

          echo "output_path=$OUTPUT_PATH" >> $GITHUB_OUTPUT
          echo "diagrams=$DIAGRAMS" >> $GITHUB_OUTPUT
          echo "python_version=$PYTHON_VERSION" >> $GITHUB_OUTPUT
          echo "create_pr=$CREATE_PR" >> $GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.defaults.outputs.python_version }}

      - name: Install PyYAML
        run: |
          pip install pyyaml

      - name: Download architecture generator
        run: |
          curl -fsSL https://raw.githubusercontent.com/zepfu/repo-standards/main/scripts/generate_architecture.py \
            -o /tmp/generate_architecture.py
          chmod +x /tmp/generate_architecture.py

      - name: Generate architecture documentation
        run: |
          OUTPUT_PATH="${{ steps.defaults.outputs.output_path }}"
          DIAGRAMS="${{ steps.defaults.outputs.diagrams }}"

          mkdir -p "$(dirname "$OUTPUT_PATH")"

          if [ "$DIAGRAMS" = "all" ]; then
            python3 /tmp/generate_architecture.py \
              --output "$OUTPUT_PATH" \
              --all-diagrams
          else
            python3 /tmp/generate_architecture.py \
              --output "$OUTPUT_PATH" \
              --diagrams "$DIAGRAMS"
          fi

      - name: Format generated markdown
        run: |
          OUTPUT_PATH="${{ steps.defaults.outputs.output_path }}"
          pip install mdformat mdformat-gfm mdformat-tables mdformat-frontmatter
          echo "Formatting: $OUTPUT_PATH"
          mdformat --wrap 120 "$OUTPUT_PATH"

      - name: Check if documentation changed
        id: check_changes
        run: |
          OUTPUT_PATH="${{ steps.defaults.outputs.output_path }}"

          if git diff --quiet "$OUTPUT_PATH" 2>/dev/null; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.check_changes.outputs.changed == 'true' && steps.defaults.outputs.create_pr == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'docs: auto-update architecture documentation'
          title: 'Auto-update Architecture Documentation'
          body: |
            ## Automated Architecture Update

            This PR was automatically generated because changes were detected in the codebase.

            ### What Changed

            The architecture documentation has been regenerated from the current codebase using:
            - Generator: `generate_architecture.py` from [repo-standards](https://github.com/zepfu/repo-standards)
            - Diagrams: ${{ steps.defaults.outputs.diagrams }}
            - Output: `${{ steps.defaults.outputs.output_path }}`

            ### Review Checklist

            - [ ] Diagrams accurately reflect the current codebase
            - [ ] Relationships between components are correct
            - [ ] No sensitive information is exposed
            - [ ] State machines and workflows are accurate

            ### Known Limitations

            Auto-generated diagrams may miss dynamic behavior, external systems,
            configuration-driven behavior, and dead code.

            ---

            *Generated by: `.github/workflows/reusable-update-architecture.yml` from repo-standards*
          branch: auto-update-architecture
          delete-branch: true
          labels: |
            documentation
            automated
            architecture

      - name: Summary
        if: always()
        run: |
          echo "## Architecture Documentation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.check_changes.outputs.changed }}" = "true" ]; then
            echo "- [PASS] Generated: \`${{ steps.defaults.outputs.output_path }}\`" >> $GITHUB_STEP_SUMMARY
            if [ "${{ steps.defaults.outputs.create_pr }}" = "true" ]; then
              echo "- Pull request created for review" >> $GITHUB_STEP_SUMMARY
            else
              echo "- Changes committed directly (no PR)" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "- [SKIP] Architecture documentation is already up to date" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "**Architecture generation complete**" >> $GITHUB_STEP_SUMMARY
