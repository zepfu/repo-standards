---
name: Docker Build Standards

on:
  workflow_call:
    inputs:
      platforms:
        type: string
        default: 'linux/amd64'
        description: 'Platforms to build for'
      push:
        type: boolean
        default: false
        description: 'Push image after build'
  push:
    branches: [main, master]
    paths:
      - 'Dockerfile'
      - '**.dockerfile'
      - '.dockerignore'
      - 'docker-compose.yml'
      - 'docker-compose.*.yml'
  pull_request:
    paths:
      - 'Dockerfile'
      - '**.dockerfile'
      - '.dockerignore'
      - 'docker-compose.yml'
      - 'docker-compose.*.yml'

jobs:
  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          PLATFORMS="${{ inputs.platforms }}"
          [ -z "$PLATFORMS" ] && PLATFORMS="linux/amd64"

          PUSH="${{ inputs.push }}"
          [ -z "$PUSH" ] && PUSH="false"

          echo "## Docker Build" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Platform(s): \`$PLATFORMS\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Push: \`$PUSH\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ inputs.push || false }}
          platforms: ${{ inputs.platforms || 'linux/amd64' }}
          tags: test:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Inspect image
        if: ${{ !inputs.push }}
        run: |
          docker images test:latest

      - name: Summary
        run: |
          echo "- [PASS] Docker image built successfully" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "---" >> "$GITHUB_STEP_SUMMARY"
          echo "**Docker build complete**" >> "$GITHUB_STEP_SUMMARY"
