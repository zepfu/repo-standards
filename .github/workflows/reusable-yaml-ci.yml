---
name: YAML Standards Enforcement (Docker)

on:
  workflow_call:
    inputs:
      yamllint-version:
        type: string
        default: 'latest'
        description: 'yamllint version to use'
      config:
        type: string
        default: '{extends: relaxed, rules: {line-length: {max: 150}}}'
        description: 'yamllint configuration'
      strict:
        type: boolean
        default: false
        description: 'Fail on warnings (default: errors only)'

  push:
    branches: [main, master]
    paths:
      - '**.yml'
      - '**.yaml'
      - '.yamllint'
      - '.yamllint.yml'

  pull_request:
    paths:
      - '**.yml'
      - '**.yaml'
      - '.yamllint'
      - '.yamllint.yml'

  workflow_dispatch: {}

jobs:
  validate-yaml:
    name: Validate YAML Files (Docker)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for YAML files
        id: check_yaml
        run: |
          if compgen -G "*.yml" > /dev/null || compgen -G "*.yaml" > /dev/null || \
             compgen -G "**/*.yml" > /dev/null || compgen -G "**/*.yaml" > /dev/null; then
            echo "has_yaml=true" >> $GITHUB_OUTPUT
            echo "✓ YAML files found"
          else
            echo "has_yaml=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No YAML files found, skipping validation"
          fi

      - name: Pull yamllint Docker image
        if: steps.check_yaml.outputs.has_yaml == 'true'
        run: |
          docker pull cytopia/yamllint:${{ inputs.yamllint-version }}
          echo "✓ yamllint Docker image ready"

      - name: Check for yamllint config
        if: steps.check_yaml.outputs.has_yaml == 'true'
        id: check_config
        run: |
          if [ -f ".yamllint" ] || [ -f ".yamllint.yml" ]; then
            echo "has_config=true" >> $GITHUB_OUTPUT
            echo "✓ Found custom yamllint config"
          else
            echo "has_config=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No custom yamllint config, using workflow defaults"
          fi

      - name: Run yamllint with custom config
        if: steps.check_yaml.outputs.has_yaml == 'true' && steps.check_config.outputs.has_config == 'true'
        run: |
          echo "## 📋 YAML Linting (yamllint)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Using custom configuration file" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if docker run --rm -v "$(pwd)":/data -w /data \
            cytopia/yamllint:${{ inputs.yamllint-version }} \
            yamllint . 2>&1 | tee yamllint.txt; then
            echo "✅ All YAML files passed linting" >> $GITHUB_STEP_SUMMARY
          else
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            cat yamllint.txt >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "❌ YAML linting issues found" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Run yamllint with workflow config
        if: steps.check_yaml.outputs.has_yaml == 'true' && steps.check_config.outputs.has_config == 'false'
        run: |
          echo "## 📋 YAML Linting (yamllint)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Using workflow configuration:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`yaml" >> $GITHUB_STEP_SUMMARY
          echo "${{ inputs.config }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if docker run --rm -v "$(pwd)":/data -w /data \
            cytopia/yamllint:${{ inputs.yamllint-version }} \
            yamllint -d '${{ inputs.config }}' . 2>&1 | tee yamllint.txt; then
            echo "✅ All YAML files passed linting" >> $GITHUB_STEP_SUMMARY
          else
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            cat yamllint.txt >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "❌ YAML linting issues found" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Validate YAML syntax (Python in Docker)
        if: steps.check_yaml.outputs.has_yaml == 'true'
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## ✓ YAML Syntax Validation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          docker run --rm -v "$(pwd)":/src -w /src python:3.13-slim \
            bash -c '
              pip install -q pyyaml
              FAILED=false
              shopt -s globstar nullglob
              for file in **/*.yml **/*.yaml *.yml *.yaml; do
                if [ -f "$file" ]; then
                  echo "Checking: $file"
                  if python3 -c "import yaml; yaml.safe_load(open(\"$file\"))" 2>&1; then
                    echo "  ✓ Valid"
                  else
                    echo "  ✗ Invalid YAML syntax in: $file"
                    FAILED=true
                  fi
                fi
              done
              if [ "$FAILED" = "true" ]; then
                exit 1
              fi
            ' 2>&1 | tee syntax.txt

          if grep -q "✗" syntax.txt; then
            grep "✗" syntax.txt >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "❌ Some YAML files have syntax errors" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "✅ All YAML files have valid syntax" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Validate GitHub workflow files
        if: steps.check_yaml.outputs.has_yaml == 'true'
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## ⚙️ GitHub Workflow Validation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ ! -d ".github/workflows" ]; then
            echo "ℹ️ No .github/workflows directory found" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          WORKFLOW_COUNT=0
          FAILED=false

          for file in .github/workflows/*.yml .github/workflows/*.yaml; do
            if [ -f "$file" ]; then
              ((WORKFLOW_COUNT++))
              echo "Validating workflow: $file"

              # Check syntax with Python in Docker
              if ! docker run --rm -v "$(pwd)":/src -w /src python:3.13-slim \
                python3 -c "import yaml; yaml.safe_load(open('/src/$file'))" 2>&1; then
                echo "  ✗ Syntax error in: $file" >> $GITHUB_STEP_SUMMARY
                FAILED=true
                continue
              fi

              # Check for required fields
              if ! grep -q "^name:" "$file"; then
                echo "  ⚠️ Warning: No 'name' field in: $file" >> $GITHUB_STEP_SUMMARY
              fi

              if ! grep -q "^on:" "$file" && ! grep -q "^'on':" "$file"; then
                echo "  ✗ Error: No 'on' trigger field in: $file" >> $GITHUB_STEP_SUMMARY
                FAILED=true
              fi

              if ! grep -q "^jobs:" "$file"; then
                echo "  ✗ Error: No 'jobs' field in: $file" >> $GITHUB_STEP_SUMMARY
                FAILED=true
              fi
            fi
          done

          if [ $WORKFLOW_COUNT -eq 0 ]; then
            echo "ℹ️ No workflow files found in .github/workflows/" >> $GITHUB_STEP_SUMMARY
          elif [ "$FAILED" = "false" ]; then
            echo "✅ All $WORKFLOW_COUNT workflow files are valid" >> $GITHUB_STEP_SUMMARY
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "❌ Some workflow files have validation errors" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: No YAML files summary
        if: steps.check_yaml.outputs.has_yaml == 'false'
        run: |
          echo "## YAML Validation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "ℹ️ No YAML files found - skipping validation" >> $GITHUB_STEP_SUMMARY

      - name: Summary
        if: steps.check_yaml.outputs.has_yaml == 'true'
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**YAML validation complete** ✅" >> $GITHUB_STEP_SUMMARY
